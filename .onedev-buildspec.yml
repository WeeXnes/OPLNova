version: 40
jobs:
- name: Dotnet Build Release
  jobExecutor: build-compiler
  steps:
  - !CheckoutStep
    name: checkout code
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: Dotnet Publish (Linux x64)
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        dotnet publish ./PS2_Manager/PS2_Manager.csproj \
                    -c Release \
                    -r linux-x64 \
                    --self-contained true \
                    -p:PublishSingleFile=true \
                    -p:PublishTrimmed=true \
                    -o ./output_linux
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: Dotnet Publish (Windows x64)
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        dotnet publish ./PS2_Manager/PS2_Manager.csproj \
                    -c Release \
                    -r win-x64 \
                    --self-contained true \
                    -p:PublishSingleFile=true \
                    -p:PublishTrimmed=true \
                    -o ./output_win
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: Download AppImageTool (Linux x64)
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        curl -L -o appimagetool-x86_64.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: Build AppImage (Linux x64)
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        mkdir -p PS2_Manager.AppDir/usr/bin
        cp -r ./output_linux/* PS2_Manager.AppDir/usr/bin/
        cp PS2_Manager/Assets/AppRun PS2_Manager.AppDir/
        cp PS2_Manager/Assets/ps2manager.desktop PS2_Manager.AppDir/
        cp PS2_Manager/Assets/ps2manager.png PS2_Manager.AppDir/
        chmod +x PS2_Manager.AppDir/AppRun
        ./appimagetool-x86_64.AppImage PS2_Manager.AppDir
        mkdir -p release
        mv PS2_Manager-x86_64.AppImage release/PS2Manager_Linux_x64.AppImage
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: Pack Releases into Zips
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        mkdir -p ./release
        zip -r ./release/PS2Manager_Linux_x64.zip ./output_linux
        zip -r ./release/PS2Manager_Windows_x64.zip ./output_win
        rm -rf ./output_linux ./output_win
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !PublishArtifactStep
    name: Upload Artifacts
    sourcePath: release
    artifacts: '**'
    condition: SUCCESSFUL
    optional: false
  triggers:
  - !BranchUpdateTrigger {}
  - !PullRequestUpdateTrigger {}
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
