version: 40
jobs:
- name: dotnet ci
  jobExecutor: build-compiler
  steps:
  - !CheckoutStep
    name: checkout code
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: dotnet restore
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        dotnet publish ./PS2_Manager/PS2_Manager.csproj \
                    -c Release \
                    -r linux-x64 \
                    --self-contained true \
                    -p:PublishSingleFile=true \
                    -p:PublishTrimmed=true \
                    -o ./output_linux
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: Pack Releases into Zips
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        mkdir -p ./release
        zip -r ./release/PS2Manager_Linux_x64.zip ./output_linux
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !SetBuildVersionStep
    name: Set Version Number
    buildVersion: '1.0'
    condition: SUCCESSFUL
    optional: false
  - !PublishArtifactStep
    name: Upload Artifacts
    sourcePath: release
    artifacts: '**'
    condition: SUCCESSFUL
    optional: false
  triggers:
  - !BranchUpdateTrigger {}
  - !PullRequestUpdateTrigger {}
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
