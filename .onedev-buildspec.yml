version: 40
jobs:
- name: Test
  jobExecutor: build-compiler
  steps:
  - !CommandStep
    name: test
    runInContainer: false
    interpreter: !DefaultInterpreter
      commands: |
        echo monkeyman
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
