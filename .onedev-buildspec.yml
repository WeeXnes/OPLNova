version: 40
jobs:
- name: dotnet ci
  jobExecutor: build-compiler
  steps:
  - !CheckoutStep
    name: checkout code
    cloneCredential: !DefaultCredential {}
    withLfs: false
    withSubmodules: false
    condition: SUCCESSFUL
    optional: false
  - !GenerateChecksumStep
    name: generate project checksum
    files: '**/*.csproj'
    targetFile: checksum
    condition: SUCCESSFUL
    optional: false
  - !SetupCacheStep
    name: set up nuget cache
    key: nuget_packages_@file:checksum@
    loadKeys:
    - nuget_packages
    paths:
    - /root/.nuget/packages
    uploadStrategy: UPLOAD_IF_NOT_HIT
    condition: SUCCESSFUL
    optional: false
  - !CommandStep
    name: test and analyze
    runInContainer: true
    image: mcr.microsoft.com/dotnet/sdk
    interpreter: !DefaultInterpreter
      commands: |
        set -e
        dotnet tool install -g roslynator.dotnet.cli
        dotnet test -l trx --collect:"XPlat Code Coverage"
        #/root/.dotnet/tools/roslynator analyze -o roslynator-analysis.xml
    useTTY: true
    condition: SUCCESSFUL
    optional: false
  - !PublishTRXReportStep
    name: publish unit test report
    reportName: Unit Test
    filePatterns: '**/*.trx'
    condition: ALWAYS
    optional: false
  - !PublishCoberturaReportStep
    name: publish code coverage report
    reportName: Code Coverage
    filePatterns: '**/coverage.cobertura.xml'
    condition: ALWAYS
    optional: false
  - !PublishRoslynatorReportStep
    name: publish code problem report
    reportName: Code Problems
    filePatterns: roslynator-analysis.xml
    failThreshold: HIGH
    condition: ALWAYS
    optional: false
  triggers:
  - !BranchUpdateTrigger {}
  - !PullRequestUpdateTrigger {}
  retryCondition: never
  maxRetries: 3
  retryDelay: 30
  timeout: 14400
